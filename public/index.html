<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HST Mobile Security</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🛡️ HST MOBILE SECURITY</h1>
  <p>Personal Device Protection</p>

  <div class="card">
    <h2>Security Dashboard</h2>
    <p id="status">Your security dashboard is ready.</p>
  </div>

  <div class="card">
    <h3>Face & Fingerprint</h3>
    <button onclick="showInfo()">Admin Verification</button>
  </div>

  <div class="card">
    <h3>Wi-Fi Protection</h3>
    <p>Trusted Network Management</p>
  </div>

  <div class="card">
    <h3>Bluetooth Protection</h3>
    <p>Trusted Device Management</p>
  </div>

  <div class="card">
    <h3>Wrong Access Alarm</h3>
    <button onclick="testAlarm()">Test Alarm</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
